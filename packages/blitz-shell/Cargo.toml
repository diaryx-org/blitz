[package]
name = "blitz-shell"
description = "Blitz application shell"
documentation = "https://docs.rs/blitz-shell"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["accessibility", "clipboard", "file-dialog"]
accessibility = [
    "dep:accesskit",
    "dep:accesskit_xplat",
    # Android's adapter: a no-op on every other target.
    "accesskit_xplat/accesskit_android",
    "blitz-dom/accessibility",
]
clipboard = ["dep:arboard"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
# The system's picker for `<input type=file>` (src/files.rs), and the file
# input itself in blitz-dom, which is inert without it.
file-dialog = ["blitz-dom/file-input"]
# Enables a data-uri-only NetProvider. Only needed if you aren't using the regular NetProvider
data-uri = ["dep:data-url"]
custom-widget = ["blitz-dom/custom-widget"]

[dependencies]
# Blitz dependencies
blitz-traits = { workspace = true }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
anyrender = { workspace = true }

# Windowing & Input
winit = { workspace = true }
keyboard-types = { workspace = true }
accesskit = { workspace = true, optional = true }
accesskit_xplat = { workspace = true, optional = true }

# Other dependencies
atomic_refcell = { workspace = true }
tracing = { workspace = true, optional = true }
futures-util = { workspace = true }
data-url = { workspace = true, optional = true }

# WASM
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
    "HtmlCanvasElement", "Window",
    # PATCH(diaryx): the browser's picker, for a file input (src/files/web.rs).
    "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "EventTarget",
    "File", "FileList", "Blob",
] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = "0.3"

# PATCH(diaryx): UIKit's document picker, for a file input (src/files/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSObject", "NSString", "NSURL", "NSFileManager", "NSData",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "UIDocumentPickerViewController", "UIViewController", "UIResponder",
    "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "std", "UTType", "UTCoreTypes",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.0" }

[target.'cfg(any(target_os = "windows",target_os = "macos",target_os = "linux",target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
arboard = { workspace = true, optional = true }


# PATCH(diaryx): AppKit's open panel, for a file input (src/files/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSObject", "NSString", "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel",
    "NSWindow", "NSResponder", "NSView", "objc2-uniform-type-identifiers",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "std", "UTType", "UTCoreTypes",
] }

# PATCH(diaryx): the Common Item Dialog, for a file input
# (src/files/windows.rs): COM's functions and the dialog's types, its
# interfaces declared by hand. The version winit builds.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
